<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>고쟁 조옮김 가이드</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=Noto+Sans+KR:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wood-dark:#241209;
    --wood-mid:#3c2013;
    --lacquer:#a13a2e;
    --lacquer-dark:#7c2a20;
    --gold:#c9a227;
    --string:#e9dfc6;
    --string-dim:#9c8f74;
    --cream:#f2e9d4;
    --ink:#1c120a;
    --teal:#2fd9c4;
    --teal-dim:#1c8c7d;
    --pitch-up:#e0584a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(ellipse at 30% -10%, #52301c 0%, transparent 70%),
      repeating-linear-gradient(100deg, var(--wood-dark) 0px, var(--wood-mid) 3px, var(--wood-dark) 6px),
      var(--wood-dark);
    background-attachment: fixed, fixed, fixed;
    color:var(--cream);
    font-family:'Noto Sans KR', sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:36px 16px 60px;
    overflow-x:hidden;
  }

  header{ text-align:center; margin-bottom:6px; }
  h1{
    font-family:'Noto Serif KR', serif; font-weight:900;
    font-size:clamp(28px, 5.5vw, 44px); margin:0; color:var(--cream);
    text-shadow:0 2px 0 var(--lacquer-dark), 0 4px 14px rgba(0,0,0,0.5);
    letter-spacing:0.04em;
  }
  .credit{
    text-align:center; font-size:13px; color:var(--string-dim);
    margin-top:8px; letter-spacing:0.03em; line-height:1.6;
  }
  .credit-bright{ color:var(--cream); opacity:0.9; font-weight:600; }

  .control-bar{
    margin:24px 0 20px;
    display:flex; flex-direction:column; align-items:center;
    gap:14px;
    background:linear-gradient(180deg, #2c170c, #1c0f07);
    border:1px solid rgba(201,162,39,0.35);
    border-radius:18px;
    padding:16px 26px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.4);
  }
  .control-row{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:16px; width:100%;
  }
  .control-group{ display:flex; align-items:center; gap:10px; }
  .control-cluster{ display:flex; align-items:center; gap:16px; flex-wrap:nowrap; }
  .control-bar label{ font-size:13px; color:var(--gold); letter-spacing:0.06em; white-space:nowrap; }
  .arrow-sep{ font-size:20px; color:var(--gold); }

  select{
    appearance:none; background:var(--ink); color:var(--cream);
    border:1px solid var(--gold); border-radius:8px;
    padding:8px 34px 8px 14px; font-family:'Noto Sans KR', sans-serif;
    font-size:14px; font-weight:600; cursor:pointer;
    background-image:linear-gradient(45deg, transparent 50%, var(--gold) 50%), linear-gradient(135deg, var(--gold) 50%, transparent 50%);
    background-position: calc(100% - 18px) center, calc(100% - 13px) center;
    background-size: 5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  select:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .toggle-group{ display:flex; gap:6px; }
  .toggle-btn{
    background:var(--ink); color:var(--string-dim);
    border:1px solid rgba(201,162,39,0.4); border-radius:8px;
    padding:7px 14px; font-family:'Noto Sans KR', sans-serif;
    font-size:13px; font-weight:600; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .toggle-btn:hover{ color:var(--cream); border-color:var(--gold); }
  .toggle-btn.active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  .toggle-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .volume-group{ flex-direction:column; align-items:flex-start; gap:8px; }
  .volume-row{ display:flex; align-items:center; gap:10px; }
  .volume-presets{ display:flex; gap:5px; }
  input[type=range]{
    -webkit-appearance:none; appearance:none;
    width:120px; height:4px; border-radius:2px;
    background:linear-gradient(90deg, var(--gold), var(--string-dim));
    outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:16px; height:16px; border-radius:50%;
    background:var(--cream); border:2px solid var(--gold);
    cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.5);
  }
  input[type=range]::-moz-range-thumb{
    width:16px; height:16px; border-radius:50%;
    background:var(--cream); border:2px solid var(--gold); cursor:pointer;
  }
  #volLabel{ font-size:12px; color:var(--string-dim); min-width:32px; }
  .vol-preset-btn{
    background:var(--ink); color:var(--string-dim);
    border:1px solid rgba(201,162,39,0.35); border-radius:6px;
    padding:3px 9px; font-family:'Noto Sans KR', sans-serif;
    font-size:11px; font-weight:600; cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .vol-preset-btn:hover{ color:var(--cream); border-color:var(--gold); }
  .vol-preset-btn:active{ background:var(--gold); color:var(--ink); border-color:var(--gold); }
  .vol-preset-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .summary-panel{
    width:min(560px, 94vw);
    margin:0 0 22px;
    background:linear-gradient(180deg, #2c170c, #1c0f07);
    border:1px solid rgba(201,162,39,0.35);
    border-radius:16px;
    padding:18px 24px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.05), 0 8px 24px rgba(0,0,0,0.4);
    text-align:center;
  }
  .summary-headline{ font-size:17px; font-weight:800; color:var(--gold); margin-bottom:6px; }
  .summary-headline.none{ color:var(--teal); }
  .summary-detail{ font-size:13px; color:var(--string-dim); line-height:1.8; }
  .summary-detail b{ color:var(--pitch-up); }

  .instrument{
    position:relative;
    width:min(680px, 96vw);
    background:linear-gradient(180deg, #4a2a17, #2f1a0e 70%, #241209);
    border-radius:20px;
    padding:30px 32px 36px;
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,0.06),
      inset 0 -30px 60px rgba(0,0,0,0.45),
      0 30px 60px rgba(0,0,0,0.55);
    border:1px solid rgba(0,0,0,0.5);
  }
  .instrument::before{
    content:""; position:absolute; inset:12px;
    border:1px solid rgba(201,162,39,0.18); border-radius:14px; pointer-events:none;
  }

  .strings{ display:flex; flex-direction:column; gap:8px; }

  .string-row{
    display:flex; align-items:center; gap:16px;
    width:100%; height:24px;
    border-radius:8px;
    cursor:pointer;
    transition:background 0.15s ease;
  }
  .string-row.changed{ background:rgba(224,88,74,0.12); }
  .string-row:hover .wire{ filter:brightness(1.25); }
  .string-row.plucking .wire{
    animation:pluck 0.4s ease-out;
  }
  @keyframes pluck{
    0%{ transform: scaleY(1); }
    25%{ transform: scaleY(2.4); }
    55%{ transform: scaleY(1.6); }
    100%{ transform: scaleY(1); }
  }
  .string-row .idx{
    width:32px; flex-shrink:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    line-height:1;
  }
  .string-row .idx-num{ font-size:14px; color:var(--string-dim); font-weight:600; }
  .string-row .idx-dots{ font-size:7px; letter-spacing:1px; color:var(--string-dim); height:7px; line-height:7px; }

  .string-row .wire{
    height:5px; border-radius:3px;
    background:linear-gradient(90deg, var(--string), var(--string-dim));
    transform-origin:left center;
  }
  .string-row.sol .wire{ background:linear-gradient(90deg, var(--teal), var(--teal-dim)); }
  .string-row.changed .wire{ background:linear-gradient(90deg, #f2a89c, var(--pitch-up)); }

  .string-row .label{
    display:flex; align-items:baseline; gap:8px; flex-shrink:0; white-space:nowrap;
  }
  .string-row .solfege{
    font-family:'Noto Serif KR', serif; font-size:18px; font-weight:600; color:var(--gold);
    width:26px;
  }
  .string-row.sol .solfege{ color:var(--teal); }
  .string-row .old-note{ font-size:13px; color:var(--string-dim); font-weight:600; }
  .string-row .change-arrow{ font-size:13px; color:var(--string-dim); }
  .string-row .new-note{ font-size:14px; color:var(--string-dim); font-weight:600; }
  .string-row.changed .new-note{ color:var(--pitch-up); font-weight:800; }
  .string-row.changed .change-arrow{ color:var(--pitch-up); }
</style>
</head>
<body>

<header>
  <h1>고쟁 조옮김 가이드</h1>
  <div class="credit credit-bright">현재 장조에서 다른 장조로 바꿀 때, <b>몇 번 현을 어떤 음으로</b> 재조율해야 하는지 알려드립니다.</div>
  <div class="credit credit-bright">tarosu.ooa@gmail.com</div>
</header>

<div class="control-bar">
  <div class="control-row">
    <div class="control-group">
      <label for="oldKeySelect">현재 장조</label>
      <select id="oldKeySelect"></select>
    </div>
    <div class="arrow-sep">→</div>
    <div class="control-group">
      <label for="newKeySelect">바꿀 장조</label>
      <select id="newKeySelect"></select>
    </div>
  </div>
  <div class="control-row">
    <div class="control-cluster">
      <div class="control-group">
        <label>현 수</label>
        <div class="toggle-group">
          <button type="button" id="btn21" class="toggle-btn active">21현</button>
          <button type="button" id="btn14" class="toggle-btn">14현</button>
        </div>
      </div>
      <div class="control-group volume-group">
        <div class="volume-row">
          <label for="volume">볼륨</label>
          <input type="range" id="volume" min="0" max="100" value="15">
          <span id="volLabel">15%</span>
        </div>
        <div class="volume-presets">
          <button type="button" class="vol-preset-btn" data-vol="15">15%</button>
          <button type="button" class="vol-preset-btn" data-vol="50">50%</button>
          <button type="button" class="vol-preset-btn" data-vol="70">70%</button>
          <button type="button" class="vol-preset-btn" data-vol="100">100%</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="summary-panel">
  <div class="summary-headline" id="summaryHeadline">-</div>
  <div class="summary-detail" id="summaryDetail"></div>
</div>

<div class="instrument">
  <div class="strings" id="strings"></div>
</div>

<script>
(function(){
  const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const PENTATONIC = [0,2,4,7,9]; // 도 레 미 솔 라
  const SOLFEGE = ['도','레','미','솔','라'];
  const STRING_COUNT = 21;

  function midiToLabel(midi){
    const pc = ((midi % 12) + 12) % 12;
    const oct = Math.floor(midi / 12) - 1;
    return NOTE_NAMES[pc] + oct;
  }

  // --- 간단한 피아노풍 합성음 (클릭 시 재생용) ---
  const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  let masterGain = null;
  const bufferCache = {};
  function getAudioCtx(){
    if(!audioCtx){
      audioCtx = new AudioCtxClass();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = parseInt(document.getElementById('volume').value, 10) / 100;
      masterGain.connect(audioCtx.destination);
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function midiToFreq(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }

  const HARMONIC_AMPS = [1, 0.55, 0.30, 0.17, 0.10, 0.06];
  function pianoBuffer(ctx, freq){
    const key = Math.round(freq * 100);
    if(bufferCache[key]) return bufferCache[key];
    const sampleRate = ctx.sampleRate;
    const tauBase = clamp(60 / freq, 0.06, 0.22);
    const duration = clamp(tauBase * 1.8, 0.12, 0.35);
    const totalSamples = Math.floor(duration * sampleRate);
    const out = new Float32Array(totalSamples);
    const nyquistGuard = sampleRate * 0.45;
    for(let h = 1; h <= HARMONIC_AMPS.length; h++){
      const fh = freq * h;
      if(fh > nyquistGuard) break;
      const amp = HARMONIC_AMPS[h - 1];
      const tauH = tauBase / (1 + (h - 1) * 0.32);
      const w = 2 * Math.PI * fh / sampleRate;
      const phase = Math.random() * Math.PI * 2;
      for(let i = 0; i < totalSamples; i++){
        out[i] += amp * Math.sin(w * i + phase) * Math.exp(-i / (tauH * sampleRate));
      }
    }
    const hammerSamples = Math.min(totalSamples, Math.floor(sampleRate * 0.018));
    for(let i = 0; i < hammerSamples; i++){
      out[i] += (Math.random() * 2 - 1) * 0.2 * Math.exp(-i / (hammerSamples * 0.3));
    }
    const attackSamples = Math.max(1, Math.floor(sampleRate * 0.002));
    for(let i = 0; i < attackSamples; i++) out[i] *= i / attackSamples;

    const fadeSamples = Math.max(1, Math.floor(totalSamples * 0.08));
    const fadeStart = totalSamples - fadeSamples;
    let peak = 0;
    for(let i = 0; i < totalSamples; i++){
      const tailGain = i >= fadeStart ? (totalSamples - i) / fadeSamples : 1;
      out[i] *= tailGain;
      const m = Math.abs(out[i]);
      if(m > peak) peak = m;
    }
    const norm = peak > 0 ? 0.9 / peak : 1;
    for(let i = 0; i < totalSamples; i++) out[i] *= norm;

    const buffer = ctx.createBuffer(1, totalSamples, sampleRate);
    buffer.copyToChannel(out, 0);
    bufferCache[key] = buffer;
    return buffer;
  }
  function playNote(freq){
    const ctx = getAudioCtx();
    const buffer = pianoBuffer(ctx, freq);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    const highpass = ctx.createBiquadFilter();
    highpass.type = 'highpass'; highpass.frequency.value = 45;
    const smooth = ctx.createBiquadFilter();
    smooth.type = 'lowpass'; smooth.frequency.value = 8500; smooth.Q.value = 0.6;
    source.connect(highpass); highpass.connect(smooth); smooth.connect(masterGain);
    source.start();
  }

  // --- Volume control ---
  const volumeSlider = document.getElementById('volume');
  const volLabel = document.getElementById('volLabel');
  function setVolume(v){
    volumeSlider.value = v;
    volLabel.textContent = v + '%';
    if(masterGain) masterGain.gain.value = v / 100;
  }
  volumeSlider.addEventListener('input', () => setVolume(parseInt(volumeSlider.value, 10)));
  document.querySelectorAll('.vol-preset-btn').forEach((btn) => {
    btn.addEventListener('click', () => setVolume(parseInt(btn.dataset.vol, 10)));
  });

  const oldKeySelect = document.getElementById('oldKeySelect');
  const newKeySelect = document.getElementById('newKeySelect');
  NOTE_NAMES.forEach((name, offset) => {
    const opt1 = document.createElement('option');
    opt1.value = offset; opt1.textContent = name + ' 장조';
    oldKeySelect.appendChild(opt1);
    const opt2 = document.createElement('option');
    opt2.value = offset; opt2.textContent = name + ' 장조';
    newKeySelect.appendChild(opt2);
  });
  oldKeySelect.value = 2; // D
  newKeySelect.value = 7; // G

  // 두 오음계 사이에서, 공통으로 쓸 수 있는 음은 그대로 두고
  // 실제로 남거나 모자란 음끼리만 가장 가까운 반음 이동으로 짝지어 최소 변경안을 계산한다.
  function computeModulation(oldRoot, newRoot){
    const oldPC = PENTATONIC.map(iv => (oldRoot + iv) % 12);
    const newPC = PENTATONIC.map(iv => (newRoot + iv) % 12);

    function circDist(a, b){ const d = Math.abs(a - b) % 12; return Math.min(d, 12 - d); }
    function signedDelta(a, b){ let d = ((b - a) + 18) % 12 - 6; if(d === -6) d = 6; return d; }

    const degreeResult = oldPC.map((pc) => {
      const sameIdx = newPC.indexOf(pc);
      if(sameIdx !== -1) return { changed:false, delta:0, newDegreeIdx: sameIdx };
      return null;
    });

    const missingPool = [];
    newPC.forEach((pc, i) => { if(!oldPC.includes(pc)) missingPool.push(i); });

    degreeResult.forEach((r, d) => {
      if(r) return;
      let bestJ = 0, bestDist = Infinity;
      missingPool.forEach((mi, j) => {
        const dist = circDist(oldPC[d], newPC[mi]);
        if(dist < bestDist){ bestDist = dist; bestJ = j; }
      });
      const targetIdx = missingPool[bestJ];
      missingPool.splice(bestJ, 1);
      degreeResult[d] = { changed:true, delta: signedDelta(oldPC[d], newPC[targetIdx]), newDegreeIdx: targetIdx };
    });

    return degreeResult;
  }

  function widthFor(i){
    const maxW = 100, minW = 34;
    const t = i / (STRING_COUNT - 1);
    return maxW - t * (maxW - minW);
  }

  const stringsEl = document.getElementById('strings');
  const rows = [];
  for(let i = 0; i < STRING_COUNT; i++){
    const row = document.createElement('div');
    row.className = 'string-row';

    const idx = document.createElement('div');
    idx.className = 'idx';
    const dotsAbove = document.createElement('div');
    dotsAbove.className = 'idx-dots';
    const num = document.createElement('div');
    num.className = 'idx-num';
    const dotsBelow = document.createElement('div');
    dotsBelow.className = 'idx-dots';
    idx.appendChild(dotsAbove); idx.appendChild(num); idx.appendChild(dotsBelow);

    const wire = document.createElement('div');
    wire.className = 'wire';
    wire.style.width = widthFor(i) + '%';

    const label = document.createElement('div');
    label.className = 'label';
    const solfege = document.createElement('span');
    solfege.className = 'solfege';
    const oldNote = document.createElement('span');
    oldNote.className = 'old-note';
    const changeArrow = document.createElement('span');
    changeArrow.className = 'change-arrow';
    changeArrow.textContent = '→';
    const newNote = document.createElement('span');
    newNote.className = 'new-note';
    label.appendChild(solfege);
    label.appendChild(oldNote);
    label.appendChild(changeArrow);
    label.appendChild(newNote);

    row.appendChild(idx);
    row.appendChild(wire);
    row.appendChild(label);
    stringsEl.appendChild(row);
    const rowData = { row, wire, solfege, oldNote, changeArrow, newNote, num, dotsAbove, dotsBelow, targetMidi: null };
    rows.push(rowData);

    row.addEventListener('click', () => {
      if(rowData.targetMidi == null) return;
      playNote(midiToFreq(rowData.targetMidi));
      row.classList.remove('plucking');
      void row.offsetWidth;
      row.classList.add('plucking');
    });
  }
  rows.forEach(({row}) => row.addEventListener('animationend', () => row.classList.remove('plucking')));

  const DEGREE_NUMBERS = [1, 2, 3, 5, 6];

  function updateIdxDisplay(){
    rows.forEach((el, i) => {
      const degree = i % 5;
      const g = Math.floor(i / 5);
      const belowCount = Math.max(0, 2 - g);
      const aboveCount = Math.max(0, g - 2);
      el.num.textContent = DEGREE_NUMBERS[degree];
      el.dotsBelow.textContent = '•'.repeat(belowCount);
      el.dotsAbove.textContent = '•'.repeat(aboveCount);
      el.dotsBelow.style.visibility = belowCount ? 'visible' : 'hidden';
      el.dotsAbove.style.visibility = aboveCount ? 'visible' : 'hidden';
    });
  }
  updateIdxDisplay();

  const summaryHeadline = document.getElementById('summaryHeadline');
  const summaryDetail = document.getElementById('summaryDetail');

  function recompute(){
    const oldRoot = parseInt(oldKeySelect.value, 10);
    const newRoot = parseInt(newKeySelect.value, 10);
    const degreeResult = computeModulation(oldRoot, newRoot);
    const oldTonicMidiOct2 = 36 + oldRoot;

    let changedCount = 0;
    const changedGroups = []; // { strings:[...], oldLabel, newLabel, oldDeg, newDeg }

    rows.forEach((el, i) => {
      const degree = i % 5;
      const octAdd = Math.floor(i / 5);
      const oldMidi = oldTonicMidiOct2 + PENTATONIC[degree] + octAdd * 12;
      const result = degreeResult[degree];
      const newMidi = oldMidi + (result.changed ? result.delta : 0);
      el.targetMidi = newMidi; // 클릭하면 항상 "조율이 완료된 음"이 재생되도록 저장

      el.solfege.textContent = SOLFEGE[degree];
      el.row.classList.toggle('sol', degree === 3);

      if(result.changed){
        el.row.classList.add('changed');
        el.oldNote.textContent = midiToLabel(oldMidi);
        el.changeArrow.style.display = 'inline';
        el.newNote.textContent = midiToLabel(newMidi) + ` (${SOLFEGE[result.newDegreeIdx]})`;
        changedCount++;
      } else {
        el.row.classList.remove('changed');
        el.oldNote.textContent = midiToLabel(oldMidi);
        el.changeArrow.style.display = 'inline';
        el.newNote.textContent = SOLFEGE[result.newDegreeIdx];
      }
    });

    // 요약: 도수별로 몇 번 현들이 바뀌는지 그룹핑
    for(let d = 0; d < 5; d++){
      if(!degreeResult[d].changed) continue;
      const stringNumbers = [];
      for(let i = 0; i < STRING_COUNT; i++){ if(i % 5 === d) stringNumbers.push(i + 1); }
      const octAddFirst = Math.floor(stringNumbers[0] - 1) / 5;
      changedGroups.push({
        stringNumbers,
        oldLabel: SOLFEGE[d],
        newLabel: SOLFEGE[degreeResult[d].newDegreeIdx],
        delta: degreeResult[d].delta
      });
    }

    if(changedCount === 0){
      summaryHeadline.textContent = '재조율이 필요한 현이 없습니다';
      summaryHeadline.classList.add('none');
      summaryDetail.textContent = '두 장조가 같은 오음계를 공유하고 있어요.';
    } else {
      summaryHeadline.classList.remove('none');
      summaryHeadline.textContent = `총 ${changedCount}개 현을 재조율해야 합니다`;
      summaryDetail.innerHTML = changedGroups.map(g => {
        const dir = g.delta > 0 ? '반음 올림' : '반음 내림';
        return `<b>${g.stringNumbers.join(', ')}번</b> 현: ${g.oldLabel} → ${g.newLabel} (${dir})`;
      }).join('<br>');
    }
  }

  oldKeySelect.addEventListener('change', recompute);
  newKeySelect.addEventListener('change', recompute);

  // --- 21현 / 14현 토글 ---
  const FOURTEEN_START = 7; // 0-based index of string 8 (기본 D장조 기준 F#3)
  let stringMode = 21;
  const btn21 = document.getElementById('btn21');
  const btn14 = document.getElementById('btn14');

  function applyStringMode(){
    rows.forEach(({row}, i) => {
      row.style.display = (stringMode === 14 && i < FOURTEEN_START) ? 'none' : 'flex';
    });
  }
  btn21.addEventListener('click', () => {
    stringMode = 21;
    btn21.classList.add('active');
    btn14.classList.remove('active');
    applyStringMode();
  });
  btn14.addEventListener('click', () => {
    stringMode = 14;
    btn14.classList.add('active');
    btn21.classList.remove('active');
    applyStringMode();
  });

  recompute();
})();
</script>
</body>
</html>
